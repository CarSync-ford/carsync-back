spring:
  application:
    name: arquitetura-orientada-servicos-sprint1
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  mvc:
    contentnegotiation:
      default-content-type: application/json
  servlet:
    multipart:
      enabled: true
      max-file-size: 1MB
      max-request-size: 1MB
  flyway:
    enabled: true
  bcrypt:
    salt: ${BCRYPT_SALT}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES}
  issuer: ${JWT_ISSUER}
  refresh-token-expiry-days: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:30}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  capacity: ${RATE_LIMIT_CAPACITY:10}
  tokens-per-second: ${RATE_LIMIT_TOKENS_PER_SECOND:10}

hmac:
  secret: ${HMAC_SECRET}
  enabled: ${HMAC_ENABLED:true}

data-retention:
  hard-delete-retention-days: ${DATA_RETENTION_HARD_DELETE_DAYS:30}
  inactive-user-retention-years: ${DATA_RETENTION_INACTIVE_YEARS:5}
  hard-delete-cron: "${DATA_RETENTION_HARD_DELETE_CRON:0 0 2 * * *}"
  anonymization-cron: "${DATA_RETENTION_ANONYMIZATION_CRON:0 0 3 * * 0}"
  enabled: ${DATA_RETENTION_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

