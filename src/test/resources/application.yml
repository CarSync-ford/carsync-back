spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration/h2
  jpa:
    hibernate:
      ddl-auto: none

server:
  ssl:
    enabled: false

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8080

rate-limit:
  enabled: false

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi0zMmJ5dGVzLW9yLW1vcmU=
  expiration-minutes: 30
  issuer: carsync-auth
  refresh-token-expiry-days: 30

hmac:
  secret: test-hmac-secret
  enabled: false

data-retention:
  hard-delete-retention-days: 30
  inactive-user-retention-years: 5
  hard-delete-cron: "-"
  anonymization-cron: "-"
  enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
