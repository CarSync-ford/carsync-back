name: Deploy Spring Boot to Azure Container Apps

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  ACR_LOGIN_SERVER: acrcarsyncdev.azurecr.io
  IMAGE_NAME: carsync-api
  APP_NAME: carsync-api-dev
  RESOURCE_GROUP: carsync-dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests
        run: mvn test -Dspring.profiles.active=test

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: target/surefire-reports/*.xml

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep:1.178.0 \
            semgrep scan \
            --error \
            --config p/ci \
            --config p/java \
            --config p/secrets \
            --sarif-output=/src/semgrep.sarif \
            /src

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          sarif_file: semgrep.sarif

  sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run OWASP Dependency-Check
        run: mvn org.owasp:dependency-check-maven:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload Dependency-Check Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: warn

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: sca

    steps:
      - name: Checkout Full History
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect \
            --source /repo \
            --config /repo/.gitleaks.toml \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact

  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Record container metadata
        run: |
          mkdir -p container-scan-report
          IMAGE_REF="${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_ID=$(docker image inspect --format='{{.Id}}' "$IMAGE_REF")
          echo "$IMAGE_ID" > container-scan-report/image-id.txt
          cat <<EOF > container-scan-report/scan-metadata.txt
          IMAGE_REF=${IMAGE_REF}
          IMAGE_ID=${IMAGE_ID}
          GIT_SHA=${{ github.sha }}
          RUN_ID=${{ github.run_id }}
          DOCKER_VERSION=$(docker --version)
          SCANNER_ACTION=aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
          EOF
          echo "Container Image ID: $IMAGE_ID"

      - name: Scan deployment image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
          format: table
          output: container-scan-report/trivy-report.txt

      - name: Display Trivy report
        if: always()
        run: |
          if [ -f container-scan-report/trivy-report.txt ]; then
            cat container-scan-report/trivy-report.txt
          fi

      - name: Upload container scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-scan-report
          path: container-scan-report/
          retention-days: 14
          if-no-files-found: warn

      # ponytail: docker save/load artifact transfer for single runner arch; replace with OCI registry cache or signing/attestation (cosign) if multi-arch or larger images
      - name: Save approved Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p image-artifact
          IMAGE_REF="${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker save -o image-artifact/approved-image.tar "$IMAGE_REF"
          cp container-scan-report/image-id.txt image-artifact/image-id.txt
          echo "Saved approved image $IMAGE_REF"

      - name: Upload approved image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approved-container-image
          path: image-artifact/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: [test, sast, sca, secret-scan, container-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download approved image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: approved-container-image
          path: image-artifact

      - name: Verify loaded container image ID
        run: |
          if [ ! -f image-artifact/approved-image.tar ] || [ ! -f image-artifact/image-id.txt ]; then
            echo "Error: Approved image artifact missing" >&2
            exit 1
          fi
          EXPECTED_IMAGE_ID=$(cat image-artifact/image-id.txt | tr -d '[:space:]')
          if [ -z "$EXPECTED_IMAGE_ID" ]; then
            echo "Error: Expected image ID is empty" >&2
            exit 1
          fi
          docker load -i image-artifact/approved-image.tar
          IMAGE_REF="${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LOADED_IMAGE_ID=$(docker image inspect --format='{{.Id}}' "$IMAGE_REF" 2>/dev/null | tr -d '[:space:]')
          echo "Expected Image ID: $EXPECTED_IMAGE_ID"
          echo "Loaded Image ID:   $LOADED_IMAGE_ID"
          if [ -z "$LOADED_IMAGE_ID" ] || [ "$LOADED_IMAGE_ID" != "$EXPECTED_IMAGE_ID" ]; then
            echo "Error: Loaded image ID does not match approved image ID!" >&2
            exit 1
          fi
          docker tag "$IMAGE_REF" "${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest"
          echo "Image ID verification successful: $LOADED_IMAGE_ID"

      - name: Login to ACR
        uses: azure/docker-login@15c4aadf093404726ab2ff205b2cdd33fa6d054c # v2
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.REGISTERY_USERNAME }}
          password: ${{ secrets.REGISTERY_PASSWORD }}

      - name: Push approved Docker image
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          REPO_DIGEST=$(docker image inspect --format='{{index .RepoDigests 0}}' ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }})
          if [ -z "$REPO_DIGEST" ] || [ "$REPO_DIGEST" = "<no value>" ]; then
            echo "Error: Published registry digest could not be captured" >&2
            exit 1
          fi
          echo "Published registry digest: $REPO_DIGEST"
          mkdir -p deploy-evidence
          cat <<EOF > deploy-evidence/published-digest.txt
          IMAGE_REF=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          REPO_DIGEST=${REPO_DIGEST}
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          GIT_SHA=${{ github.sha }}
          RUN_ID=${{ github.run_id }}
          EOF

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deploy-evidence
          path: deploy-evidence/
          retention-days: 30
          if-no-files-found: warn

      - name: Azure Login
        uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --set-env-vars "APPLICATIONINSIGHTS_CONNECTION_STRING=${{ secrets.APPINSIGHTS_CONNECTION_STRING }}"
